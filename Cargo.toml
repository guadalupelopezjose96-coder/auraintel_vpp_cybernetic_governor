[package]
name = "auraintel-vpp-cybernetic-governor"
version = "1.0.0"
edition = "2021"
authors = ["guadalupelopezjose96-org <security@auraintelcore.com>"]
license = "Apache-2.0 OR MIT"
description = "Industrial Cybernetic Governor v1.0.0 for Distributed Energy Resources & AAUFSA Governance"

[dependencies]
actix-web = { version = "4.9.0", default-features = false, features = ["macros", "compress-brotli", "compress-gzip"] }
chrono = { version = "0.4.38", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.210", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.128", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10.8", default-features = false }
tokio = { version = "1.40.0", default-features = false, features = ["macros", "rt-multi-thread", "net", "sync"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
